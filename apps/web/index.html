<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><meta name="referrer" content="strict-origin-when-cross-origin"/><meta name="theme-color" content="#ffffff"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><meta name="apple-mobile-web-app-title" content="Notemap"/><link rel="manifest" href="%BASE_URL%manifest.webmanifest"/><link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png"/><link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/notemap.svg"/><title>Notemap</title></head>
<body><div id="startup-recovery" role="status" style="padding:32px 24px;font:16px/1.5 system-ui;text-align:center"><p id="startup-title">Открываем Notemap…</p><div id="startup-actions" hidden><p>Не удалось запустить приложение. Проверь интернет и повтори загрузку. Сохранённые данные не удаляются.</p><button id="startup-retry" style="padding:12px 20px;border:0;border-radius:12px;background:#0068ff;color:white;font:inherit">Повторить загрузку</button></div></div><div id="root"></div>
<script>
(()=>{const notice=document.getElementById('startup-recovery');const show=()=>{notice.hidden=false;document.getElementById('startup-title').textContent='Notemap не загрузился';document.getElementById('startup-actions').hidden=false;};let timer=setTimeout(show,20000);window.addEventListener('notemap-mounted',()=>{clearTimeout(timer);notice.hidden=true;});window.addEventListener('notemap-startup-error',show);window.addEventListener('error',event=>{if(event.target instanceof HTMLScriptElement&&event.target.dataset.notemapOptional!=='true')show();},true);document.getElementById('startup-retry').onclick=()=>{const url=new URL(location.href);url.searchParams.set('recover',Date.now().toString());location.replace(url.href);};})();
</script><script type="module" src="/src/main.tsx"></script></body></html>
