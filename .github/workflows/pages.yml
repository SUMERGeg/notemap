name: Deploy Notemap to GitHub Pages

# Pushes to main publish after successful tests and build.
# Manual runs can still build an artifact without publishing.
# Before publishing, configure Pages to use GitHub Actions and set repository
# Actions variable VITE_GEOAPIFY_API_KEY to an origin-restricted browser key.
# Browser keys appear in the public bundle; never use a server secret here.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Site path: /notemap/ for project Pages, / for a custom domain'
        type: string
        default: /notemap/
        required: true
      publish:
        description: 'Publish the artifact to Pages for this manual run'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notemap-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NOTEMAP_BASE_PATH: ${{ inputs.base_path || '/notemap/' }}
      VITE_GEOAPIFY_API_KEY: ${{ vars.VITE_GEOAPIFY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Require the browser map key
        run: test -n "$VITE_GEOAPIFY_API_KEY" || { echo 'Set Actions variable VITE_GEOAPIFY_API_KEY before building Pages.'; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  publish:
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
